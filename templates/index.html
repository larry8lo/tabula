<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabula</title>
<link rel="icon" href="/static/favicon.ico" sizes="32x32">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">
  <header class="app-header">
    <h1>Tabula</h1>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <div class="dropdown" id="quick-add-dropdown">
        <button id="btn-quick-add" class="btn btn-primary">+ New Task ▾</button>
        <div class="dropdown-menu" id="quick-add-menu" hidden>
          <button class="dropdown-item" data-preset="15m">In 15 minutes</button>
          <button class="dropdown-item" data-preset="1h">In 1 hour</button>
          <button class="dropdown-item" data-preset="4h">In 4 hours</button>
          <button class="dropdown-item" data-preset="eod">End of today</button>
          <button class="dropdown-item" data-preset="eot">End of tomorrow</button>
          <button class="dropdown-item" data-preset="eow">End of week</button>
          <button class="dropdown-item dropdown-item-custom" id="btn-quick-add-custom">Custom…</button>
        </div>
      </div>

      <div class="dropdown" id="recurring-dropdown">
        <button id="btn-recurring" class="btn btn-accent2">New Recurring Task ▾</button>
        <div class="dropdown-menu" id="recurring-menu" hidden>
          <button class="dropdown-item" data-schedule-type="daily">1 or N times every day</button>
          <button class="dropdown-item" data-schedule-type="weekly">Days in a week</button>
          <button class="dropdown-item" data-schedule-type="monthly">Days in a month</button>
          <button class="dropdown-item dropdown-item-custom" id="btn-manage-recurring">Manage…</button>
        </div>
      </div>
    </div>

    <div class="toolbar-group toolbar-group-selection">
      <span id="selection-count" class="selection-count" hidden></span>
      <button id="btn-bulk-complete" class="btn btn-success" disabled>Complete</button>
      <button id="btn-bulk-cancel" class="btn btn-warning" disabled>Cancel</button>
      <button id="btn-bulk-delete" class="btn btn-danger" disabled>Delete</button>
    </div>
  </div>

  <div class="table-scroll">
    <table class="task-table">
      <thead>
        <tr>
          <th class="col-expand"></th>
          <th class="col-name">Task</th>
          <th class="col-due">Due</th>
          <th class="col-status">Status</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="task-list">
        <!-- rows injected by app.js -->
      </tbody>
    </table>
  </div>
  <p id="empty-state" class="empty-state" hidden>No tasks yet. Create one above.</p>
</div>

<!-- New task modal (generic creation) -->
<div class="modal-overlay" id="modal-new-task" hidden>
  <div class="modal">
    <h2>New Task</h2>
    <label class="field">
      <span>Task name</span>
      <input type="text" id="new-task-name" placeholder="e.g. Submit expense report">
    </label>
    <div class="field">
      <span>Due date &amp; time</span>
      <div class="datetime-field" id="new-task-due-field"></div>
    </div>
    <label class="field">
      <span>Notes <span class="field-optional">(optional)</span></span>
      <textarea id="new-task-notes" rows="3" placeholder="Any extra detail…"></textarea>
    </label>
    <p class="field-error" id="new-task-error" hidden></p>
    <div class="modal-actions">
      <button class="btn" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="new-task-save">Create Task</button>
    </div>
  </div>
</div>

<!-- Quick-add name modal (due time is preset) -->
<div class="modal-overlay" id="modal-quick-add" hidden>
  <div class="modal">
    <h2>New Task <span id="quick-add-preset-label" class="modal-subtitle"></span></h2>
    <label class="field">
      <span>Task name</span>
      <input type="text" id="quick-add-name" placeholder="e.g. Call the dentist">
    </label>
    <label class="field">
      <span>Notes <span class="field-optional">(optional)</span></span>
      <textarea id="quick-add-notes" rows="3" placeholder="Any extra detail…"></textarea>
    </label>
    <p class="field-error" id="quick-add-error" hidden></p>
    <div class="modal-actions">
      <button class="btn" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="quick-add-save">Create Task</button>
    </div>
  </div>
</div>

<!-- Edit task modal (name, due date, notes) -->
<div class="modal-overlay" id="modal-edit-due" hidden>
  <div class="modal">
    <h2>Edit Task</h2>
    <label class="field">
      <span>Task name</span>
      <input type="text" id="edit-task-name-input" placeholder="e.g. Submit expense report">
    </label>
    <div class="field">
      <span>Due date &amp; time</span>
      <div class="datetime-field" id="edit-due-field"></div>
    </div>
    <label class="field">
      <span>Notes <span class="field-optional">(optional)</span></span>
      <textarea id="edit-notes-input" rows="3" placeholder="Any extra detail…"></textarea>
    </label>
    <p class="field-error" id="edit-due-error" hidden></p>
    <div class="modal-actions">
      <button class="btn" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="edit-due-save">Save</button>
    </div>
  </div>
</div>

<!-- New recurring task modal -->
<div class="modal-overlay" id="modal-recurring" hidden>
  <div class="modal">
    <h2><span id="recurring-modal-heading">New Recurring Task</span> <span id="recurring-type-label" class="modal-subtitle"></span></h2>
    <p class="modal-subtitle" id="recurring-edit-task-name" hidden></p>
    <label class="field" id="recurring-name-field">
      <span>Task name</span>
      <input type="text" id="recurring-name" placeholder="e.g. Take out trash">
    </label>
    <label class="field" id="recurring-notes-field">
      <span>Notes <span class="field-optional">(optional)</span></span>
      <textarea id="recurring-notes" rows="3" placeholder="Any extra detail…"></textarea>
    </label>
    <div class="field">
      <span>Schedule</span>
      <div id="recurring-schedule-fields"></div>
    </div>
    <p class="field-error" id="recurring-error" hidden></p>
    <div class="modal-actions">
      <button class="btn" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="recurring-save">Create Recurring Task</button>
    </div>
  </div>
</div>

<!-- Manage recurring tasks modal -->
<div class="modal-overlay" id="modal-manage-recurring" hidden>
  <div class="modal">
    <h2>Recurring Tasks</h2>
    <div id="recurring-list"></div>
    <p class="empty-state" id="recurring-list-empty" hidden>No recurring tasks yet.</p>
    <div class="modal-actions">
      <button class="btn" data-close-modal>Close</button>
    </div>
  </div>
</div>

<!-- Status change popover -->
<div class="status-popover" id="status-popover" hidden>
  <button class="dropdown-item" data-status="in_progress">In Progress</button>
  <button class="dropdown-item" data-status="complete">Complete</button>
  <button class="dropdown-item" data-status="canceled">Canceled</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
